name: Update Blog From Steam News

on:
  schedule:
    # Every 6 hours. Steam News API is fetched server-side here, which
    # sidesteps the browser CORS problem entirely (see scripts/update-blog.js).
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Steam News and update index.html
        run: node scripts/update-blog.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml
          git commit -m "chore: refresh blog posts from Steam News [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
