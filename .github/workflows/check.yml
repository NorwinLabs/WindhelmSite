name: Check

# Runs on pull requests and on every branch except main (main is handled by
# build-assets.yml, which commits rebuilt assets).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build assets
        run: npm run build
      - name: Built assets are committed and up to date
        run: git diff --exit-code
      - name: Validate pages (SEO tags, sitemap, local references)
        run: npm run validate

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true # advisory: report scores, don't block merges
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.json
